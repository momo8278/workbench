<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的工作台</title>
<style>
:root{
  --bg:#f6f7f9;
  --card:#ffffff;
  --line:#e6e8ec;
  --line-soft:#f0f1f4;
  --ink:#1f2329;
  --ink-2:#5b6270;
  --ink-3:#9096a1;
  --accent:#c0392b;
  --accent-soft:#fdf0ee;
  --blue:#2f6fb5;
  --blue-soft:#eaf1f9;
  --green:#2e8b57;
  --green-soft:#eaf5ee;
  --amber:#b8860b;
  --amber-soft:#fdf6e3;
  --purple:#6a4c93;
  --purple-soft:#f2eef8;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.side{
  width:212px;flex:0 0 212px;
  background:var(--card);
  border-right:1px solid var(--line);
  padding:22px 14px;
  display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.side-id{padding:0 8px 18px}
.side-id .nm{font-size:15px;font-weight:700;letter-spacing:.02em}
.side-id .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.navbtn{
  display:flex;align-items:center;gap:9px;
  border:0;background:transparent;text-align:left;
  padding:9px 10px;border-radius:9px;color:var(--ink-2);
  font-size:13.5px;font-weight:500;width:100%;
}
.navbtn:hover{background:var(--line-soft);color:var(--ink)}
.navbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.navbtn svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
.side-foot button{
  border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:6px 9px;font-size:12px;color:var(--ink-2);text-align:left;
}
.side-foot button:hover{border-color:var(--ink-3);color:var(--ink)}
.side-foot .hint{font-size:11px;color:var(--ink-3);line-height:1.5}

.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1240px}
.page{display:none}
.page.on{display:block}

/* ---------- header ---------- */
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.hd h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em}
.hd .dt{font-size:13px;color:var(--ink-3);margin-top:3px}
.hd .tools{display:flex;gap:8px;align-items:center}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);
}
.card h2{
  margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ink-2);
  letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.card h2 .r{font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.empty{color:var(--ink-3);font-size:12.5px;padding:10px 0}

/* ---------- pills / chips ---------- */
.chip{
  display:inline-block;padding:1px 8px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
}
.c-work{background:var(--blue-soft);color:var(--blue)}
.c-self{background:var(--purple-soft);color:var(--purple)}
.c-meet{background:var(--amber-soft);color:var(--amber)}
.c-out{background:var(--green-soft);color:var(--green)}
.c-gen{background:var(--line-soft);color:var(--ink-2)}

/* ---------- progress ---------- */
.bar{height:7px;border-radius:20px;background:var(--line-soft);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:20px;background:var(--blue);transition:width .35s ease}
.bar.ok > i{background:var(--green)}
.bar.warn > i{background:var(--amber)}
.bar.bad > i{background:var(--accent)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi .lb{font-size:11.5px;color:var(--ink-3);letter-spacing:.03em}
.kpi .vl{font-size:23px;font-weight:700;margin-top:3px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .vl small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:3px}
.kpi .df{font-size:11.5px;margin-top:3px;color:var(--ink-3)}
.up{color:var(--green);font-weight:700}
.dn{color:var(--accent);font-weight:700}

/* ---------- table ---------- */
table.rpt{width:100%;border-collapse:collapse;font-size:13px}
table.rpt th,table.rpt td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
table.rpt th{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.03em;border-bottom:1px solid var(--line)}
table.rpt th:first-child,table.rpt td:first-child{text-align:left}
table.rpt td{font-variant-numeric:tabular-nums}
table.rpt tbody tr:hover{background:#fafbfc}
table.rpt tr.sum td{font-weight:700;border-top:1px solid var(--line);background:#fafbfc}
.tw{overflow-x:auto}

/* ---------- lists ---------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row .bd{flex:1;min-width:0}
.row .tt{font-size:13.5px;line-height:1.45;word-break:break-word}
.row .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .x{border:0;background:transparent;color:var(--ink-3);font-size:15px;line-height:1;padding:2px 4px;border-radius:5px}
.row .x:hover{background:var(--accent-soft);color:var(--accent)}
.ck{appearance:none;width:16px;height:16px;border:1.6px solid var(--ink-3);border-radius:5px;margin:3px 0 0;flex:0 0 16px;position:relative}
.ck:checked{background:var(--green);border-color:var(--green)}
.ck:checked::after{content:"";position:absolute;left:4.4px;top:1.4px;width:4px;height:8px;border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.done .tt{text-decoration:line-through;color:var(--ink-3)}
.due-soon{color:var(--amber);font-weight:700}
.due-over{color:var(--accent);font-weight:700}

/* ---------- forms ---------- */
.frm{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.frm input[type=text],.frm textarea{
  flex:1;min-width:130px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--card);
}
.frm input[type=date],.frm input[type=number],.frm select{
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);
}
.frm input:focus,.frm select:focus,.frm textarea:focus{outline:0;border-color:var(--blue)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#000}
.btn.sm{padding:4px 9px;font-size:12px;font-weight:500}

/* ---------- calendar ---------- */
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-hd .mo{font-size:15px;font-weight:700}
.cal-hd .nav{display:flex;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;color:var(--ink-3);text-align:center;padding:3px 0;font-weight:600}
.cel{
  min-height:70px;border:1px solid var(--line-soft);border-radius:9px;padding:5px 6px;
  background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:3px;
}
.cel:hover{border-color:var(--blue);background:var(--blue-soft)}
.cel.pad{background:#fafbfc;cursor:default;border-color:transparent}
.cel.pad:hover{background:#fafbfc}
.cel.today{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent-soft)}
.cel .dn{font-size:11.5px;color:var(--ink-3);font-weight:600;color:var(--ink-3)}
.cel.today .dn{color:var(--accent)}
.cel .ev{
  font-size:10.5px;border-radius:4px;padding:1px 4px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cel .ev.t{background:var(--accent-soft);color:var(--accent)}

/* ---------- misc ---------- */
.goal{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.goal:last-of-type{border-bottom:0}
.goal .gt{font-size:16px;font-weight:700;color:var(--accent);letter-spacing:.01em}
.goal .gd{font-size:12.5px;color:var(--ink-2);margin-top:3px;white-space:pre-wrap}
.prj{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.prj:last-of-type{border-bottom:0}
.prj .ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.prj .pn{font-size:13.5px;font-weight:600}
.prj .pp{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.prj .bar{margin-top:6px}
.note{
  background:var(--amber-soft);border:1px solid #f0e3c0;color:#7a5c05;
  border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:16px;line-height:1.55;
}
.note b{font-weight:700}
.hero{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px;
}
.hero .hi{font-size:19px;font-weight:700}
.hero .hs{font-size:13px;color:var(--ink-3);margin-top:2px}
.hero .quote{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--ink);color:#fff;font-weight:700}

/* ---------- 專案進度卡片（版型與外網版一致） ---------- */
.prj-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.prj-toolbar input[type=text]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:var(--card)}
.prj-toolbar input:focus{outline:0;border-color:var(--blue)}
.prj-counts{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;color:var(--ink-3)}
.prj-counts b{font-size:16px;font-weight:700;color:var(--ink);margin-right:4px;font-variant-numeric:tabular-nums}
.prj-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);height:270px;display:flex;flex-direction:column;overflow:hidden}
.pcard.expanded{height:auto}
.pcard .pt{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.pcard .ptt{font-size:14.5px;font-weight:700;line-height:1.4}
.pcard .pbar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-shrink:0}
.pcard .pbar-row b{font-size:13px;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
/* 拖曳條同時就是進度條：軌道用漸層填充，不再另外畫一條 */
.pbar{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:7px;border-radius:20px;cursor:pointer;outline:0;margin:0}
.pbar::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--ink-3);box-shadow:0 1px 2px rgba(16,24,40,.25);cursor:pointer}
.pbar:hover::-webkit-slider-thumb,.pbar:focus::-webkit-slider-thumb{border-color:var(--ink)}
.pbar::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--ink-3);cursor:pointer}
.pcard .pdet{border-top:1px solid var(--line-soft);padding-top:10px;margin-top:2px;flex:1 1 auto;min-height:0;overflow:hidden;position:relative}
.pcard.expanded .pdet{overflow:visible;flex:none}
.pcard .pdet::after{content:'';position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(transparent,var(--card))}
.pcard.expanded .pdet::after{display:none}
.pcard .pdet-h{font-size:11px;font-weight:700;color:var(--ink-3);margin-bottom:6px;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center}
.pcard .pdi{font-size:12px;color:var(--ink-2);line-height:1.55;padding:3px 0;display:flex;gap:8px}
.pcard .pdi .pdd{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.pexp{flex-shrink:0;align-self:flex-start;border:0;background:transparent;color:var(--blue);font-size:11.5px;font-weight:600;cursor:pointer;padding:6px 0 0}
.pst{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;border:0;cursor:pointer;font-family:inherit}
.pst.s-go{background:var(--blue-soft);color:var(--blue)}
.pst.s-pause{background:var(--amber-soft);color:var(--amber)}
.pst.s-done{background:var(--green-soft);color:var(--green)}
.pst.s-none{background:#eef0f2;color:var(--ink-3)}
.pcard .pacts{display:flex;gap:4px;flex-shrink:0}
.pcard .pacts button{border:0;background:transparent;color:var(--ink-3);font-size:14px;line-height:1;padding:2px 5px;border-radius:5px;cursor:pointer}
.pcard .pacts button:hover{background:var(--line-soft);color:var(--ink)}
.pcard .pacts button.del:hover{background:var(--accent-soft);color:var(--accent)}

/* ---------- 資料檔連結區 ---------- */
.auth{padding:10px 8px 12px;border-bottom:1px solid var(--line-soft);margin-bottom:8px}
.auth .who{font-size:11.5px;color:var(--green);font-weight:700;line-height:1.5;word-break:break-all}
.auth .st{font-size:11px;color:var(--ink-3);line-height:1.5;margin-top:2px}
.auth .st.err{color:var(--accent)}
.auth button{width:100%;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:700}
.auth button:hover{background:#000}
.auth button.ghost{background:var(--card);color:var(--ink-2);border-color:var(--line);font-weight:500;margin-top:5px}
.auth button.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
</style>
</head>
<body>
<div class="shell">

  <nav class="side">
    <div class="side-id">
      <div class="nm">我的工作台</div>
      <div class="sub" id="syncSub">資料存這台瀏覽器</div>
    </div>

    <div class="auth" id="fileBox">
      <div class="who" id="fileWho" style="display:none"></div>
      <div class="st" id="fileSt">尚未連結資料夾</div>
      <button id="btnLinkFile">連結 OneDrive 資料夾</button>
      <button class="ghost" id="btnUnlinkFile" style="display:none">改用本機儲存</button>
    </div>

    <button class="navbtn on" data-go="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>首頁總覽</button>
    <button class="navbtn" data-go="todo">
      <svg viewBox="0 0 24 24"><path d="M9 5h11"/><path d="M9 12h11"/><path d="M9 19h11"/><path d="m3 5 2 2 2-3"/><path d="m3 12 2 2 2-3"/><path d="m3 19 2 2 2-3"/></svg>待辦與行事曆</button>
    <button class="navbtn" data-go="goal">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>專案進度</button>

    <div class="side-foot">
      <button id="btnReport" style="border-color:var(--ink);color:var(--ink);font-weight:700">產出 HTML 週報</button>
      <div class="hint" id="repMsg" style="display:none"></div>
      <button id="btnExport">匯出資料 JSON</button>
      <button id="btnImport">匯入資料 JSON</button>
      <input type="file" id="fileImport" accept=".json" hidden>
      <div class="hint" id="footHint">連結 OneDrive 資料夾就能跨機同步；沒連結時只存這台瀏覽器。<br>← → 可換頁。</div>
    </div>
  </nav>

  <main class="main">

    <!-- ============ 首頁總覽 ============ -->
    <section class="page on" id="p-home">
      <div class="hero">
        <div class="hi" id="greet">你好</div>
        <div class="hs" id="today"></div>
        <div class="quote" id="heroSum"></div>
      </div>

      <div class="grid g3">
        <div class="card">
          <h2>待辦清單 <span class="r" id="homeTodoCnt"></span></h2>
          <div id="homeTodos"></div>
        </div>
        <div class="card">
          <h2>近期行程 <span class="r">未來 14 天</span></h2>
          <div id="homeEvents"></div>
        </div>
        <div class="card">
          <h2>專案進度 <span class="r" id="homePrjCnt"></span></h2>
          <div id="homePrjs"></div>
        </div>
      </div>
    </section>

    <!-- ============ 待辦與行事曆 ============ -->
    <section class="page" id="p-todo">
      <div class="hd">
        <div>
          <h1>待辦與行事曆</h1>
          <div class="dt">點月曆上的日期可直接新增當天行程</div>
        </div>
      </div>

      <div class="grid g2" style="margin-bottom:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)">
        <div class="card">
          <h2>待辦清單 <span class="r" id="todoCnt"></span></h2>
          <div id="todoList"></div>
          <div class="frm">
            <input type="text" id="tdText" placeholder="要做什麼？">
            <input type="date" id="tdDue">
            <select id="tdCat">
              <option value="work">工作</option>
              <option value="self">個人</option>
              <option value="meet">會議</option>
              <option value="out">外出</option>
            </select>
            <button class="btn pri" id="btnAddTodo">新增</button>
          </div>
          <div class="frm" style="border:0;padding-top:4px;margin-top:4px">
            <label style="font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px">
              <input type="checkbox" id="tdShowDone"> 顯示已完成
            </label>
            <button class="btn sm" id="btnClearDone" style="margin-left:auto">清除已完成</button>
          </div>
        </div>

        <div class="card">
          <div class="cal-hd">
            <div class="mo" id="calMo"></div>
            <div class="nav">
              <button class="btn sm" id="calPrev">←</button>
              <button class="btn sm" id="calToday">本月</button>
              <button class="btn sm" id="calNext">→</button>
            </div>
          </div>
          <div class="cal" id="calGrid"></div>
        </div>
      </div>

      <div class="card">
        <h2>行程 <span class="r" id="evCnt"></span></h2>
        <div id="evList"></div>
        <div class="frm">
          <input type="text" id="evText" placeholder="行程內容">
          <input type="date" id="evDate">
          <select id="evCat">
            <option value="work">工作</option>
            <option value="self">個人</option>
            <option value="meet">會議</option>
            <option value="out">外出</option>
          </select>
          <button class="btn pri" id="btnAddEv">新增</button>
        </div>
      </div>
    </section>

    <!-- ============ 目標與專案 ============ -->
    <section class="page" id="p-goal">
      <div class="hd">
        <div>
          <h1>專案進度</h1>

<script>
/* =========================================================
   個人工作台（GitHub Pages 版）
   - 純個人資料，不含任何公司資訊、不連公司系統
   - 儲存兩種模式：
       本機模式 = localStorage（預設）
       同步模式 = File System Access API 直接讀寫 OneDrive 裡的一個 JSON 檔，
                  由 OneDrive 負責跨機同步。需 HTTPS（GitHub Pages 符合）。
   ========================================================= */

const K = {
  todos:   'MJ_WB_TODOS',
  events:  'MJ_WB_EVENTS',
};
const CAT = {
  work:{lb:'工作', cls:'c-work'},
  self:{lb:'個人', cls:'c-self'},
  meet:{lb:'會議', cls:'c-meet'},
  out :{lb:'外出', cls:'c-out'},
};

let ST = { todos:[], events:[] };
let calY, calM;

/* =========================================================
   儲存層：本機 localStorage / OneDrive 資料夾二選一

   連結資料夾後，夾內兩個檔各有各的寫入者，互不覆寫：
     workbench-data.json  待辦／行程／長期目標——只有這個頁面會寫
     projects.md          專案進度＋進展明細——由 Claude 維護，這裡只讀
   ========================================================= */
const FS_OK = typeof window.showDirectoryPicker === 'function';
const F_DATA = 'workbench-data.json';
const F_PRJ  = 'projects.md';
let dirHandle = null;
let writeTimer = null;
let lastWrite = '';
let MD_PROJECTS = [];       // 從 projects.md 解析出的專案
let MD_RAW = '';            // projects.md 原文，寫回時以行為單位改
let prjMdInfo = '';         // 顯示用的來源說明

function fileSt(msg, isErr){
  const el = document.getElementById('fileSt');
  el.textContent = msg || '';
  el.className = 'st' + (isErr ? ' err' : '');
}
function syncUI(){
  const on = !!dirHandle;
  document.getElementById('fileWho').style.display = on ? 'block' : 'none';
  document.getElementById('btnLinkFile').style.display = on ? 'none' : 'block';
  document.getElementById('btnUnlinkFile').style.display = on ? 'block' : 'none';
  document.getElementById('syncSub').textContent = on ? '同步中 · OneDrive 資料夾' : '資料存這台瀏覽器';
  document.getElementById('footHint').innerHTML = on
    ? '待辦寫進資料夾的 JSON；專案進度讀 projects.md（Claude 維護，這裡不覆寫）。<br>← → 可換頁。'
    : '連結 OneDrive 資料夾就能跨機同步；沒連結時只存這台瀏覽器。<br>← → 可換頁。';
}

/* ---------- projects.md 解析 ----------
   - 70% 專案名 #進行中 @2026-08-11 <https://...>
     - 2026-08-11 進展內容
*/
function parseProjectsMd(txt){
  const out = [];
  const lines = txt.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++){
    const ln = lines[i];
    if (/^\s*>/.test(ln) || /^\s*#/.test(ln)) continue;           // 引言與標題不算資料
    const top = ln.match(/^-\s+(\d{1,3})%\s+(.+)$/);
    if (top){
      let rest = top[2];
      let status = '', date = '', url = '';
      rest = rest.replace(/<([^>]+)>/, (m,u) => { url = u.trim(); return ''; });
      rest = rest.replace(/@(\d{4}-\d{2}-\d{2})/, (m,d) => { date = d; return ''; });
      rest = rest.replace(/#(\S+)/, (m,s) => { status = s; return ''; });
      out.push({
        id:'md-' + out.length,
        name: rest.trim().replace(/\s{2,}/g,' ') || '(未命名)',
        pct: Math.max(0, Math.min(100, Number(top[1]))),
        status, date, url, logs:[], src:'md',
        line: i, lastLine: i          // 原始行號，供精準編輯用
      });
      continue;
    }
    const sub = ln.match(/^\s{2,}-\s+(?:(\d{4}-\d{2}-\d{2})\s+)?(.+)$/);
    if (sub && out.length){
      const p = out[out.length-1];
      p.logs.push({ date: sub[1] || '', text: sub[2].trim(), line: i });
      p.lastLine = i;
    }
  }
  return out;
}
async function readProjectsMd(){
  MD_PROJECTS = []; prjMdInfo = '';
  if (!dirHandle) return;
  try {
    const h = await dirHandle.getFileHandle(F_PRJ);
    const f = await h.getFile();
    MD_RAW = await f.text();
    MD_PROJECTS = parseProjectsMd(MD_RAW);
    prjMdInfo = `${F_PRJ} · ${MD_PROJECTS.length} 項 · 檔案時間 ${new Date(f.lastModified).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}`;
  } catch(e){
    MD_RAW = '';
    prjMdInfo = `資料夾裡沒有 ${F_PRJ}`;
  }
}

/* =========================================================
   寫 projects.md：一律行層級操作，不重新序列化整個檔案
   ========================================================= */
async function writeProjectsMd(txt){
  const h = await dirHandle.getFileHandle(F_PRJ, { create:true });
  const w = await h.createWritable();
  await w.write(txt);
  await w.close();
  MD_RAW = txt;
  MD_PROJECTS = parseProjectsMd(MD_RAW);
}
function mdLine(p){
  const parts = [`- ${p.pct}% ${p.name}`];
  if (p.status) parts.push(`#${p.status}`);
  parts.push(`@${todayISO()}`);
  if (p.url) parts.push(`<${p.url}>`);
  return parts.join(' ');
}
/* 寫檔前先確認檔案沒被別人動過，避免蓋掉我剛寫的內容 */
async function mdGuard(){
  if (!dirHandle) throw new Error('尚未連結資料夾');
  const h = await dirHandle.getFileHandle(F_PRJ);
  const cur = await (await h.getFile()).text();
  if (cur !== MD_RAW){
    MD_RAW = cur;
    MD_PROJECTS = parseProjectsMd(cur);
    renderPrjs(); renderHome();
    throw new Error('檔案已被改過，已重新載入，請再操作一次');
  }
}
async function mdAddProject(name, pct, status, url){
  await mdGuard();
  let txt = MD_RAW.replace(/\s*$/, '');
  txt += '\n\n' + mdLine({ name, pct, status, url }) + '\n';
  await writeProjectsMd(txt);
}
async function mdSetPct(p, pct){
  await mdGuard();
  const lines = MD_RAW.split(/\r?\n/);
  if (!/^-\s+\d{1,3}%/.test(lines[p.line] || '')) throw new Error('找不到那一行，請按重讀檔案');
  lines[p.line] = lines[p.line]
    .replace(/^-\s+\d{1,3}%/, `- ${pct}%`)
    .replace(/@\d{4}-\d{2}-\d{2}/, '@' + todayISO());
  await writeProjectsMd(lines.join('\n'));
}
async function mdSetStatus(p, status){
  await mdGuard();
  const lines = MD_RAW.split(/\r?\n/);
  let ln = lines[p.line];
  if (!/^-\s+\d{1,3}%/.test(ln || '')) throw new Error('找不到那一行，請按重讀檔案');
  ln = /#\S+/.test(ln) ? ln.replace(/#\S+/, '#' + status) : ln.replace(/(\s*@\d{4}-\d{2}-\d{2})/, ' #' + status + '$1');
  if (!/#\S+/.test(ln)) ln += ' #' + status;
  lines[p.line] = ln.replace(/@\d{4}-\d{2}-\d{2}/, '@' + todayISO());
  await writeProjectsMd(lines.join('\n'));
}
async function mdAddLog(p, text){
  await mdGuard();
  const lines = MD_RAW.split(/\r?\n/);
  lines.splice(p.line + 1, 0, `  - ${todayISO()} ${text}`);   // 插在專案行下方＝最新在最上面
  lines[p.line] = lines[p.line].replace(/@\d{4}-\d{2}-\d{2}/, '@' + todayISO());
  await writeProjectsMd(lines.join('\n'));
}
async function mdRemove(p){
  await mdGuard();
  const lines = MD_RAW.split(/\r?\n/);
  const end = p.lastLine;
  lines.splice(p.line, end - p.line + 1);
  await writeProjectsMd(lines.join('\n').replace(/\n{3,}/g,'\n\n'));
}

/* 專案全部來自 projects.md */
function allProjects(){ return MD_PROJECTS; }

/* handle 存 IndexedDB，下次開頁不必重選檔案（仍需一次點擊授權） */
function idb(){
  return new Promise((res, rej) => {
    const q = indexedDB.open('mj-workbench', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('kv');
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function idbSet(k, v){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction('kv','readwrite');
    t.objectStore('kv').put(v, k);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
async function idbGet(k){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction('kv','readonly');
    const r = t.objectStore('kv').get(k);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

function stateJson(){
  return JSON.stringify({
    _meta:{ app:'mj-workbench', version:1, savedAt:new Date().toISOString() },
    todos:ST.todos, events:ST.events
  }, null, 2);
}

/* ---------- storage ---------- */
function load(){
  for (const k of ['todos','events']){
    try { ST[k] = JSON.parse(localStorage.getItem(K[k]) || '[]') || []; } catch(e){ ST[k] = []; }
  }
}
function save(key){
  localStorage.setItem(K[key], JSON.stringify(ST[key]));   // 永遠留一份本機備援
  scheduleWrite();
}
function isEmptyState(){
  return !ST.todos.length && !ST.events.length;
}

async function writeDataNow(){
  if (!dirHandle) return;
  const txt = stateJson();
  if (txt === lastWrite) return;
  try {
    const h = await dirHandle.getFileHandle(F_DATA, { create:true });
    const w = await h.createWritable();
    await w.write(txt);
    await w.close();
    lastWrite = txt;
    fileSt('已存檔 ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
  } catch(e){
    fileSt('寫入失敗：' + e.message, true);
  }
}
function scheduleWrite(){
  if (!dirHandle) return;
  clearTimeout(writeTimer);
  fileSt('儲存中…');
  writeTimer = setTimeout(writeDataNow, 800);
}

async function readDataJson(){
  try {
    const h = await dirHandle.getFileHandle(F_DATA);
    const txt = (await (await h.getFile()).text()).trim();
    if (!txt) return false;
    const js = JSON.parse(txt);
    for (const k of ['todos','events']){
      if (Array.isArray(js[k])){ ST[k] = js[k]; localStorage.setItem(K[k], JSON.stringify(ST[k])); }
    }
    lastWrite = stateJson();
    return true;
  } catch(e){
    return false;   // 檔案不存在 = 第一次連結，交給 writeDataNow 建立
  }
}

async function useDir(h, isFirstLink){
  dirHandle = h;
  const had = await readDataJson();
  if (!had) await writeDataNow();
  await readProjectsMd();
  await idbSet('dirHandle', h);
  document.getElementById('fileWho').textContent = '✓ ' + h.name + '／';
  syncUI();
  fileSt(had ? '已載入資料夾' : (isFirstLink ? '已建立 ' + F_DATA : '已載入資料夾'));
  renderAllLocal();
}
async function linkDir(){
  if (!FS_OK){
    fileSt('這個瀏覽器不支援資料夾存取（需桌面版 Edge/Chrome，且須為 https）', true);
    return;
  }
  try {
    const h = await window.showDirectoryPicker({ mode:'readwrite' });
    if (await h.requestPermission({ mode:'readwrite' }) !== 'granted'){
      fileSt('沒有取得寫入權限', true); return;
    }
    await useDir(h, true);
  } catch(e){
    if (e.name !== 'AbortError') fileSt('連結失敗：' + e.message, true);
  }
}
async function restoreDir(){
  if (!FS_OK) return false;
  try {
    const h = await idbGet('dirHandle');
    if (!h) return false;
    if (await h.queryPermission({ mode:'readwrite' }) === 'granted'){
      await useDir(h, false);
      return true;
    }
    /* 瀏覽器重開後，權限要等一次使用者手勢才能恢復 */
    const who = document.getElementById('fileWho');
    who.style.display = 'block';
    who.textContent = '⏸ ' + h.name + '／';
    const btn = document.getElementById('btnLinkFile');
    btn.textContent = '重新授權資料夾';
    btn.onclick = async () => {
      if (await h.requestPermission({ mode:'readwrite' }) === 'granted'){
        await useDir(h, false);
        btn.textContent = '連結 OneDrive 資料夾';
        btn.onclick = linkDir;
      } else fileSt('授權被拒', true);
    };
    fileSt('資料夾需重新授權才會同步');
    return false;
  } catch(e){ return false; }
}
/* Claude 改完 projects.md 後按一下就更新，不必重開頁面 */
async function reloadProjects(){
  if (!dirHandle){ fileSt('尚未連結資料夾', true); return; }
  await readProjectsMd();
  renderPrjs(); renderHome();
  fileSt('已重讀 ' + F_PRJ);
}

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const WD = ['日','一','二','三','四','五','六'];
function todayISO(){ return iso(new Date()); }
function daysBetween(aIso, bIso){
  const a = new Date(aIso + 'T00:00:00'), b = new Date(bIso + 'T00:00:00');
  return Math.round((a - b) / 86400000);
}
function fmtMD(isoStr){
  const [y,m,d] = isoStr.split('-');
  return `${Number(m)}/${Number(d)}`;
}
const nf = n => Number(n||0).toLocaleString('zh-TW');
function money(n){
  n = Number(n||0);
  if (Math.abs(n) >= 10000) return (n/10000).toFixed(1).replace(/\.0$/,'') + ' 萬';
  return nf(n);
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- nav ---------- */
const PAGES = ['home','todo','goal'];
function go(p){
  document.querySelectorAll('.page').forEach(el => el.classList.toggle('on', el.id === 'p-'+p));
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.go === p));
  location.hash = p;
  window.scrollTo(0,0);
}
document.querySelectorAll('.navbtn').forEach(b => b.onclick = () => go(b.dataset.go));
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const t = e.target, tag = (t.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || t.isContentEditable) return;
  const cur = PAGES.indexOf((location.hash || '#home').slice(1));
  const i = cur < 0 ? 0 : cur;
  const nx = e.key === 'ArrowRight' ? Math.min(i+1, PAGES.length-1) : Math.max(i-1, 0);
  if (nx !== i) go(PAGES[nx]);
});

/* =========================================================
   待辦
   ========================================================= */
function renderTodos(){
  const showDone = document.getElementById('tdShowDone').checked;
  const list = ST.todos
    .filter(t => showDone || !t.done)
    .sort((a,b) => (a.done - b.done) || ((a.due||'9999') > (b.due||'9999') ? 1 : -1));
  const open = ST.todos.filter(t => !t.done).length;
  document.getElementById('todoCnt').textContent = `未完成 ${open} / 共 ${ST.todos.length}`;
  document.getElementById('todoList').innerHTML = list.length
    ? '<div class="rows">' + list.map(t => todoRow(t)).join('') + '</div>'
    : '<div class="empty">目前沒有待辦</div>';
  bindTodoRows('#todoList');
}
function dueBadge(due){
  if (!due) return '';
  const d = daysBetween(due, todayISO());
  const cls = d < 0 ? 'due-over' : d <= 2 ? 'due-soon' : '';
  const lb = d < 0 ? `逾期 ${-d} 天` : d === 0 ? '今天到期' : d === 1 ? '明天到期' : `${d} 天後`;
  return `<span class="${cls}">${due}　${lb}</span>`;
}
function todoRow(t){
  const c = CAT[t.cat] || CAT.work;
  return `<div class="row ${t.done ? 'done' : ''}" data-id="${t.id}">
    <input type="checkbox" class="ck" ${t.done ? 'checked' : ''}>
    <div class="bd"><div class="tt">${esc(t.text)}</div>
      <div class="mt"><span class="chip ${c.cls}">${c.lb}</span>${dueBadge(t.due)}</div></div>
    <button class="x" title="刪除">×</button></div>`;
}
function bindTodoRows(sel){
  document.querySelectorAll(sel + ' .row').forEach(r => {
    const id = r.dataset.id;
    const ck = r.querySelector('.ck');
    if (ck) ck.onchange = () => {
      const t = ST.todos.find(x => x.id === id);
      if (t) { t.done = ck.checked; save('todos'); renderTodos(); renderHome(); }
    };
    const x = r.querySelector('.x');
    if (x) x.onclick = () => {
      ST.todos = ST.todos.filter(x2 => x2.id !== id);
      save('todos'); renderTodos(); renderHome(); renderCal();
    };
  });
}
document.getElementById('btnAddTodo').onclick = addTodo;
document.getElementById('tdText').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
function addTodo(){
  const el = document.getElementById('tdText');
  const text = el.value.trim();
  if (!text) return;
  ST.todos.push({ id:uid(), text, due:document.getElementById('tdDue').value || '', cat:document.getElementById('tdCat').value, done:false });
  save('todos');
  el.value = ''; document.getElementById('tdDue').value = '';
  renderTodos(); renderHome(); renderCal();
}
document.getElementById('tdShowDone').onchange = renderTodos;
document.getElementById('btnClearDone').onclick = () => {
  const n = ST.todos.filter(t => t.done).length;
  if (!n) return;
  if (!confirm(`確定刪除 ${n} 筆已完成的待辦？`)) return;
  ST.todos = ST.todos.filter(t => !t.done);
  save('todos'); renderTodos(); renderHome(); renderCal();
};

/* =========================================================
   行程 + 月曆
   ========================================================= */
function renderEvents(){
  const list = [...ST.events].sort((a,b) => a.date > b.date ? 1 : -1);
  document.getElementById('evCnt').textContent = `共 ${list.length} 筆`;
  document.getElementById('evList').innerHTML = list.length
    ? '<div class="rows">' + list.map(e => {
        const c = CAT[e.cat] || CAT.work;
        return `<div class="row" data-id="${e.id}">
          <div class="bd"><div class="tt">${esc(e.text)}</div>
            <div class="mt"><span class="chip ${c.cls}">${c.lb}</span><span>${e.date}（${WD[new Date(e.date+'T00:00:00').getDay()]}）</span></div></div>
          <button class="x" title="刪除">×</button></div>`;
      }).join('') + '</div>'
    : '<div class="empty">還沒有行程</div>';
  document.querySelectorAll('#evList .row .x').forEach(b => {
    b.onclick = () => {
      const id = b.closest('.row').dataset.id;
      ST.events = ST.events.filter(e => e.id !== id);
      save('events'); renderEvents(); renderCal(); renderHome();
    };
  });
}
document.getElementById('btnAddEv').onclick = addEvent;
document.getElementById('evText').addEventListener('keydown', e => { if (e.key === 'Enter') addEvent(); });
function addEvent(){
  const el = document.getElementById('evText');
  const text = el.value.trim();
  const date = document.getElementById('evDate').value;
  if (!text || !date) { alert('行程內容與日期都要填'); return; }
  ST.events.push({ id:uid(), text, date, cat:document.getElementById('evCat').value });
  save('events');
  el.value = '';
  renderEvents(); renderCal(); renderHome();
}

function renderCal(){
  const first = new Date(calY, calM, 1);
  const lastDay = new Date(calY, calM+1, 0).getDate();
  const lead = first.getDay();
  document.getElementById('calMo').textContent = `${calY} 年 ${calM+1} 月`;

  const byDate = {};
  for (const e of ST.events){
    (byDate[e.date] = byDate[e.date] || []).push({ t:e.text, cat:e.cat, todo:false });
  }
  for (const t of ST.todos){
    if (t.due && !t.done) (byDate[t.due] = byDate[t.due] || []).push({ t:t.text, cat:t.cat, todo:true });
  }

  let html = WD.map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < lead; i++) html += '<div class="cel pad"></div>';
  for (let d = 1; d <= lastDay; d++){
    const ds = `${calY}-${pad(calM+1)}-${pad(d)}`;
    const items = byDate[ds] || [];
    const isToday = ds === todayISO();
    html += `<div class="cel ${isToday ? 'today' : ''}" data-d="${ds}">
      <div class="dn">${d}</div>
      ${items.slice(0,3).map(x => {
        const c = CAT[x.cat] || CAT.work;
        return `<div class="ev ${x.todo ? 't' : c.cls}" title="${esc(x.t)}">${x.todo ? '待 ' : ''}${esc(x.t)}</div>`;
      }).join('')}
      ${items.length > 3 ? `<div class="ev c-gen">還有 ${items.length-3} 項</div>` : ''}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
  document.querySelectorAll('#calGrid .cel[data-d]').forEach(c => {
    c.onclick = () => {
      document.getElementById('evDate').value = c.dataset.d;
      document.getElementById('evText').focus();
    };
  });
}
document.getElementById('calPrev').onclick = () => { calM--; if (calM < 0){ calM = 11; calY--; } renderCal(); };
document.getElementById('calNext').onclick = () => { calM++; if (calM > 11){ calM = 0; calY++; } renderCal(); };
document.getElementById('calToday').onclick = () => { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); renderCal(); };

/* =========================================================
   專案進度（讀寫 projects.md）
   ========================================================= */

/* 任何寫檔動作都經過這裡：統一顯示結果、失敗不讓畫面與檔案不一致 */
async function mdDo(fn, okMsg){
  if (!dirHandle){ fileSt('要先連結資料夾才能改專案', true); return; }
  try {
    await fn();
    renderPrjs(); renderHome();
    fileSt(okMsg + ' ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
  } catch(e){
    fileSt(e.message, true);
  }
}

const PST_CLS = s => s === '進行中' ? 's-go' : s === '暫停' ? 's-pause' : s === '已完成' ? 's-done' : 's-none';
let prjFilter = '', prjQ = '';

/* 進度條的軌道漸層：左邊已完成、右邊未完成，顏色隨進度 */
function pbarStyle(pct){
  const c = pct >= 100 ? 'var(--green)' : pct >= 50 ? 'var(--blue)' : pct > 0 ? 'var(--amber)' : 'var(--line-soft)';
  return `background:linear-gradient(90deg,${c} 0 ${pct}%,var(--line-soft) ${pct}% 100%)`;
}

function renderPrjs(){
  const all = allProjects();
  const box = document.getElementById('prjList');

  const cnt = s => all.filter(p => (p.status || '') === s).length;
  document.getElementById('prjCounts').innerHTML =
    `<span><b>${all.length}</b>專案總數</span>` +
    `<span><b>${cnt('進行中')}</b>進行中</span>` +
    `<span><b>${cnt('未開始')}</b>未開始</span>` +
    `<span><b>${cnt('暫停')}</b>暫停</span>` +
    `<span><b>${cnt('已完成')}</b>已完成</span>`;
  document.getElementById('prjCnt').textContent = dirHandle ? '' : '未連結資料夾';
  document.getElementById('prjSrc').textContent = prjMdInfo || '連結資料夾後才能讀寫 ' + F_PRJ;

  let shown = all.filter(p => !prjFilter || (p.status || '') === prjFilter);
  if (prjQ){
    shown = shown.filter(p =>
      (p.name + ' ' + (p.logs || []).map(l => l.text).join(' ')).toLowerCase().includes(prjQ));
  }
  if (!shown.length){
    box.innerHTML = '<div class="empty">'
      + (all.length ? '沒有符合的專案' : (dirHandle ? '還沒有專案，用下面新增' : '連結資料夾後才會顯示專案'))
      + '</div>';
    return;
  }

  box.innerHTML = shown.map(p => {
    const logs = p.logs || [];
    const title = p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name);
    const detHtml = logs.length
      ? '<div class="pdet"><div class="pdet-h"><span>進展與明細</span><span>' + logs.length + ' 筆</span></div>'
        + logs.map(l => `<div class="pdi"><span class="pdd">${esc(l.date || '')}</span><span>${esc(l.text)}</span></div>`).join('')
        + '</div>'
      : '<div class="pdet"><div class="pdet-h"><span>進展與明細</span></div><div class="pdi" style="color:var(--ink-3)">還沒有進展，按 ＋ 加一筆</div></div>';
    return `<div class="pcard" data-id="${p.id}">
      <div class="pt">
        <div class="ptt">${title}</div>
        <div class="pacts">
          <select class="pst ${PST_CLS(p.status)}" title="改狀態">
            ${['進行中','未開始','暫停','已完成'].map(s => `<option value="${s}"${s===p.status?' selected':''}>${s}</option>`).join('')}
          </select>
          <button class="log" title="加一筆進展">＋</button>
          <button class="del" title="刪除專案">×</button>
        </div>
      </div>
      <div class="pbar-row">
        <input type="range" class="pbar" min="0" max="100" step="5" value="${p.pct}" style="${pbarStyle(p.pct)}">
        <b>${p.pct}%</b>
      </div>
      ${detHtml}
      ${logs.length > 3 ? `<button class="pexp" data-n="${logs.length}">展開全部 (${logs.length})</button>` : ''}
    </div>`;
  }).join('');

  box.querySelectorAll('.pexp').forEach(btn => btn.onclick = () => {
    const ex = btn.closest('.pcard').classList.toggle('expanded');
    btn.textContent = ex ? '收合' : ('展開全部 (' + btn.dataset.n + ')');
  });
  box.querySelectorAll('.pcard').forEach(el => {
    const p = MD_PROJECTS.find(x => x.id === el.dataset.id);
    if (!p) return;
    /* 拖曳中只更新顯示，放手才寫檔，避免拖一次寫幾十遍 */
    const rg = el.querySelector('input.pbar');
    const lb = el.querySelector('.pbar-row b');
    rg.oninput = () => {
      lb.textContent = rg.value + '%';
      rg.setAttribute('style', pbarStyle(Number(rg.value)));
    };
    rg.onchange = () => mdDo(() => mdSetPct(p, Number(rg.value)), '已更新進度');
    el.querySelector('select.pst').onchange = e => mdDo(() => mdSetStatus(p, e.target.value), '已更新狀態');
    el.querySelector('button.log').onclick = () => {
      const t = prompt('這筆進展寫什麼？（會加上今天日期）');
      if (t && t.trim()) mdDo(() => mdAddLog(p, t.trim()), '已加一筆進展');
    };
    el.querySelector('button.del').onclick = () => {
      if (!confirm(`刪除「${p.name}」？連同它的 ${p.logs.length} 筆進展一起從 ${F_PRJ} 移除。`)) return;
      mdDo(() => mdRemove(p), '已刪除');
    };
  });
}
document.querySelectorAll('#prjFilter button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#prjFilter button').forEach(x => x.classList.toggle('on', x === b));
  prjFilter = b.dataset.s; renderPrjs();
});
document.getElementById('prjSearch').oninput = e => { prjQ = e.target.value.trim().toLowerCase(); renderPrjs(); };
document.getElementById('btnAddPrj').onclick = () => {
  const el = document.getElementById('pjName');
  const n = el.value.trim();
  if (!n) return;
  const pct = Math.max(0, Math.min(100, Number(document.getElementById('pjPct').value) || 0));
  const status = document.getElementById('pjStatus').value;
  const url = document.getElementById('pjUrl').value.trim();
  mdDo(() => mdAddProject(n, pct, status, url), '已新增專案').then(() => {
    el.value = '';
    document.getElementById('pjUrl').value = '';
    document.getElementById('pjPct').value = 0;
  });
};

/* =========================================================
   首頁
   ========================================================= */
function renderHome(){
  const now = new Date(), h = now.getHours();
  const g = h < 5 ? '深夜' : h < 11 ? '早安' : h < 13 ? '午安' : h < 18 ? '午安' : '晚安';
  document.getElementById('greet').textContent = `${g}`;
  document.getElementById('today').textContent =
    `${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日 · 星期${WD[now.getDay()]}`;

  const open = ST.todos.filter(t => !t.done);
  const over = open.filter(t => t.due && daysBetween(t.due, todayISO()) < 0).length;
  const soon = open.filter(t => t.due && daysBetween(t.due, todayISO()) >= 0 && daysBetween(t.due, todayISO()) <= 2).length;
  const upcoming = ST.events
    .filter(e => { const d = daysBetween(e.date, todayISO()); return d >= 0 && d <= 14; })
    .sort((a,b) => a.date > b.date ? 1 : -1);
  const parts = [];
  parts.push(open.length ? `待辦未完成 <b>${open.length}</b> 項` : '待辦都清完了');
  if (over) parts.push(`<span class="dn">逾期 ${over} 項</span>`);
  if (soon) parts.push(`<span style="color:var(--amber);font-weight:700">3 天內到期 ${soon} 項</span>`);
  parts.push(upcoming.length ? `未來兩週 <b>${upcoming.length}</b> 個行程` : '未來兩週沒有行程');
  document.getElementById('heroSum').innerHTML = parts.join('　·　');

  /* 待辦摘要 */
  document.getElementById('homeTodoCnt').textContent = `未完成 ${open.length}`;
  const top = [...open].sort((a,b) => (a.due||'9999') > (b.due||'9999') ? 1 : -1).slice(0,6);
  document.getElementById('homeTodos').innerHTML = top.length
    ? '<div class="rows">' + top.map(t => todoRow(t)).join('') + '</div>'
    : '<div class="empty">沒有待辦</div>';
  bindTodoRows('#homeTodos');

  /* 近期行程 */
  document.getElementById('homeEvents').innerHTML = upcoming.length
    ? '<div class="rows">' + upcoming.slice(0,7).map(e => {
        const c = CAT[e.cat] || CAT.work;
        const d = daysBetween(e.date, todayISO());
        return `<div class="row"><div class="bd">
          <div class="tt">${esc(e.text)}</div>
          <div class="mt"><span class="chip ${c.cls}">${c.lb}</span><span>${fmtMD(e.date)}（${WD[new Date(e.date+'T00:00:00').getDay()]}）${d === 0 ? ' · 今天' : d === 1 ? ' · 明天' : ''}</span></div>
        </div></div>`;
      }).join('') + '</div>'
    : '<div class="empty">未來兩週沒有行程</div>';

  /* 專案（projects.md） */
  const prjs = allProjects();
  document.getElementById('homePrjCnt').textContent = `共 ${prjs.length} 項`;
  document.getElementById('homePrjs').innerHTML = prjs.length
    ? prjs.slice(0,5).map(p => {
        const cls = p.pct >= 100 ? 'ok' : p.pct >= 50 ? '' : p.pct > 0 ? 'warn' : 'bad';
        const last = (p.logs || [])[0];
        return `<div class="prj"><div class="ph"><span class="pn">${esc(p.name)}</span><span class="pp">${p.pct}%</span></div>
          <div class="bar ${cls}"><i style="width:${p.pct}%"></i></div>
          ${last ? `<div style="font-size:11.5px;color:var(--ink-3);margin-top:4px">${esc(last.date)} ${esc(last.text)}</div>` : ''}</div>`;
      }).join('')
    : '<div class="empty">還沒有專案</div>';
}

function buildHTMLReport(){
  const now = new Date();
  const ds  = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  const fnDs = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`;

  /* ── 待辦／行程彙整 ── */
  const openTodos = ST.todos.filter(t => !t.done)
    .sort((a,b) => (a.due||'9999') > (b.due||'9999') ? 1 : -1);
  const doneTodos = ST.todos.filter(t => t.done);
  const overCnt = openTodos.filter(t => t.due && daysBetween(t.due, todayISO()) < 0).length;
  const soonCnt = openTodos.filter(t => { if(!t.due) return false; const d = daysBetween(t.due, todayISO()); return d >= 0 && d <= 2; }).length;
  const upcoming = ST.events
    .filter(e => { const d = daysBetween(e.date, todayISO()); return d >= 0 && d <= 14; })
    .sort((a,b) => a.date > b.date ? 1 : -1);

  const todoSt = t => {
    if (!t.due) return '<span class="st st-todo">未排期</span>';
    const d = daysBetween(t.due, todayISO());
    if (d < 0)  return `<span class="st st-late">逾期 ${-d} 天</span>`;
    if (d === 0) return '<span class="st st-doing">今天到期</span>';
    if (d === 1) return '<span class="st st-doing">明天到期</span>';
    if (d <= 2) return `<span class="st st-doing">${d} 天內</span>`;
    return `<span class="st st-todo">${d} 天後</span>`;
  };

  /* ── 卡片頁：專案（來自 projects.md），每頁 4 張 ── */
  const prjList = allProjects();
  const cards = prjList.map(p => ({
    kind:'prj', title:p.name, desc:p.url||'', pct:p.pct, bar:'#2563eb',
    status: p.status || '', logs: p.logs || []
  }));
  const cardPages = [];
  for (let i = 0; i < cards.length; i += 4) cardPages.push(cards.slice(i, i+4));

  /* ── 頁面清單（無資料的頁不產） ── */
  const pages = [];
  if (ST.todos.length) pages.push({ key:'todo', tab:'待辦事項' });
  if (upcoming.length) pages.push({ key:'event', tab:'近期行程' });
  cardPages.forEach((c,i) => pages.push({ key:'card', idx:i, tab: cardPages.length>1 ? `專案進度 ${i+1}/${cardPages.length}` : '專案進度' }));
  if (!pages.length) throw new Error('目前沒有待辦、行程或目標，沒東西可以產');
  const TOT = pages.length;

  L.push('</style></head><body>');

  /* ── 控制列 ── */

      L.push('<table class="dt"><thead><tr><th class="tl" style="width:52%">待辦內容</th><th style="width:12%">分類</th><th style="width:16%">到期日</th><th style="width:20%">狀態</th></tr></thead><tbody>');

    if (pg.key === 'event'){
      L.push(`<div class="slide-header"><div><div class="eyebrow">近期行程 · Schedule</div><h2 class="slide-title">近期行程 ── 未來 14 天</h2></div><span class="page-tag">${pgTag(n)}</span></div>`);
      L.push('<div class="content-area">');
      L.push('<table class="dt"><thead><tr><th class="tl" style="width:16%">日期</th><th style="width:8%">星期</th><th style="width:12%">分類</th><th class="tl">行程內容</th></tr></thead><tbody>');

        const w = WD[new Date(e.date+'T00:00:00').getDay()];
        const tagTx = d === 0 ? ' <span class="st st-doing">今天</span>' : d === 1 ? ' <span class="st st-doing">明天</span>' : '';
        L.push(`<tr><td class="tl">${e.date}</td><td>${w}</td><td>${c.lb}</td><td class="tl" contenteditable="true">${esc(e.text)}${tagTx}</td></tr>`);

      L.push('</tbody></table>');
      if (upcoming.length > 14) L.push(`<p class="note">※ 未來兩週共 ${upcoming.length} 個行程，本頁列前 14 筆。</p>`);
      L.push('</div>');
    }

    if (pg.key === 'card'){
      const list = cardPages[pg.idx];
      const pCnt = prjList.length;
      const avg = pCnt ? Math.round(prjList.reduce((a,p)=>a+p.pct,0)/pCnt) : null;
      const doneN = prjList.filter(p => p.pct >= 100).length;
      L.push(`<div class="slide-header"><div><div class="eyebrow">專案進度 · Projects</div><h2 class="slide-title">專案進度${cardPages.length>1?`（${pg.idx+1}/${cardPages.length}）`:''}</h2></div><span class="page-tag">${pgTag(n)}</span></div>`);
      L.push('<div class="content-area">');
      L.push(`<div style="font-size:12px;color:#8a857c;margin-bottom:10px;"><span style="color:#2563eb;font-weight:700;">● 專案 ${pCnt} 項</span>${avg!==null?`　平均進度 ${avg}%`:''}${doneN?`　已完成 ${doneN} 項`:''}　｜　資料來源：${F_PRJ}</div>`);
      L.push('<div style="flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;">');

        card += `<span style="padding:2px 10px;border-radius:10px;font-size:11px;font-weight:700;background:${stC[0]};color:${stC[1]};">${esc(c.status || '專案')}</span>`;
        card += `<button class="del-btn" title="從報告移除此卡" onclick="this.closest('[data-card]').remove()" style="width:20px;height:20px;line-height:1;padding:0;border:none;border-radius:50%;background:#fee2e2;color:#dc2626;font-size:14px;font-weight:700;cursor:pointer;">&times;</button>`;

        card += `<div style="flex:1;height:7px;background:#eef2f7;border-radius:4px;overflow:hidden;"><div style="width:${c.pct}%;height:100%;background:${barC};border-radius:4px;"></div></div>`;
        card += `<span style="font-size:12px;font-weight:700;min-width:32px;text-align:right;color:${barC};">${c.pct}%</span></div>`;
        if (c.desc && /^https?:\/\//i.test(c.desc)){
          card += `<div style="font-size:12px;line-height:1.6;"><a href="${esc(c.desc)}" target="_blank" rel="noopener" style="color:#2563eb;">開啟相關連結</a></div>`;
        }
        /* 進展明細：每行可就地編輯，只改報告不動 projects.md */
        for (const l of (c.logs || []).slice(0,4)){
          card += '<div style="display:flex;gap:6px;font-size:12px;line-height:1.6;color:#334155;align-items:flex-start;margin-top:3px;">'
            + `<span style="flex-shrink:0;color:#94a3b8;font-variant-numeric:tabular-nums;">${esc(l.date || '　')}</span>`
            + `<span contenteditable="true" style="flex:1;outline:none;">${esc(l.text)}</span></div>`;
        }
        if ((c.logs || []).length > 4){
          card += `<div style="font-size:11px;color:#94a3b8;margin-top:3px;">另有 ${c.logs.length-4} 筆進展</div>`;
        }
        card += '</div>';
        L.push(card);
      }
      L.push('</div></div>');
    }

    L.push('</div>');
  }

  L.push('</div>');
  L.push('<footer style="max-width:1280px;width:100%;margin-bottom:16px;text-align:center;font-size:12px;color:#8a857c;display:flex;justify-content:space-between;padding:0 4px">');
  L.push('<span>點上方標籤切換 ｜ 快速鍵：↑ / ← 上一頁　↓ / → / Space 下一頁</span>');
  L.push(`<span>個人工作週報 &nbsp;${ds}</span>`);
  L.push('</footer>');

  /* ── 導覽 JS ── */
  L.push('<scr' + 'ipt>');
  L.push('(function(){');
  L.push('var cur=1;');
  L.push("function getSlides(){return Array.from(document.querySelectorAll('.slide-container'));}");
  L.push("function getTabs(){return Array.from(document.querySelectorAll('#navTabs .nav-tab'));}");
  L.push('function rebindTabs(){getTabs().forEach(function(t,i){t.onclick=function(){show(i+1);};});}');
  L.push('function updateTabs(){var tabs=getTabs();var activeTab=null;');
  L.push("  tabs.forEach(function(t,i){var on=(i+1===cur);t.classList.toggle('active',on);if(on)activeTab=t;});");
  L.push("  if(activeTab){var nt=document.getElementById('navTabs');nt.scrollLeft=activeTab.offsetLeft-nt.offsetLeft-(nt.clientWidth/2)+(activeTab.offsetWidth/2);}");
  L.push('}');
  L.push('function show(n){var slides=getSlides();var tot=slides.length;n=Math.max(1,Math.min(n,tot));');
  L.push("  slides.forEach(function(s,i){s.classList.toggle('active',i+1===n);});");
  L.push("  var pt=slides[n-1]?slides[n-1].querySelector('.page-tag'):null;");
  L.push("  if(pt){pt.textContent=pt.textContent.replace(/^\\d+\\s*\\/\\s*\\d+/,n+' / '+tot);}");
  L.push("  document.getElementById('pageInd').textContent=n+' / '+tot;");
  L.push("  document.getElementById('btnPrev').disabled=(n===1);");
  L.push("  document.getElementById('btnNext').disabled=(n===tot);");
  L.push("  cur=n;updateTabs();window.scrollTo({top:0,behavior:'smooth'});");
  L.push('}');
  L.push('rebindTabs();');
  L.push("document.getElementById('btnPrev').onclick=function(){if(cur>1)show(cur-1);};");
  L.push("document.getElementById('btnNext').onclick=function(){if(cur<getSlides().length)show(cur+1);};");
  L.push("document.getElementById('btnFs').onclick=function(){");
  L.push('  if(document.fullscreenElement){document.exitFullscreen();}');
  L.push('  else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen();}');
  L.push('};');
  L.push('function scaleNormal(){if(document.fullscreenElement)return;');
  L.push('  var CTRL_H=66,FOOTER_H=48,PAD=48;');
  L.push('  var sc=Math.min(window.innerWidth/1280,(window.innerHeight-CTRL_H-FOOTER_H-PAD)/720,1);');
  L.push("  document.querySelectorAll('.slide-container').forEach(function(s){s.style.transform='scale('+sc.toFixed(4)+')';s.style.transformOrigin='top center';});");
  L.push("  document.getElementById('slidesWrapper').style.minHeight=(Math.round(720*sc)+PAD)+'px';");
  L.push('}');
  L.push("document.addEventListener('fullscreenchange',function(){");
  L.push("  var w=document.getElementById('slidesWrapper');var ctrl=document.querySelector('.controls');var ft=document.querySelector('footer');");
  L.push('  if(document.fullscreenElement){');
  L.push("    ctrl.style.display='none';if(ft)ft.style.display='none';");
  L.push("    document.body.style.cssText='padding-top:0;background:#1b1d21;display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;overflow:hidden;';");
  L.push("    w.style.cssText='display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;padding:0;';");
  L.push('    var sc=Math.min(window.innerWidth/1280,window.innerHeight/720);');
  L.push("    document.querySelectorAll('.slide-container').forEach(function(s){s.style.transform='scale('+sc.toFixed(3)+')';s.style.transformOrigin='center center';s.style.flexShrink='0';});");
  L.push('  } else {');
  L.push("    ctrl.style.display='';if(ft)ft.style.display='';document.body.style.cssText='';w.style.cssText='';");
  L.push("    document.querySelectorAll('.slide-container').forEach(function(s){s.style.flexShrink='';});scaleNormal();");
  L.push('  }');
  L.push('});');
  L.push("window.addEventListener('resize',scaleNormal);");
  L.push("document.getElementById('btnAddSlide').onclick=function(){");
  L.push('  var tot=getSlides().length+1;');
  L.push("  var ns=document.createElement('div');ns.className='slide-container';");
  L.push('  ns.innerHTML=\'<div class="slide-header"><div><div class="eyebrow">新增頁面 · New Slide</div>\'');
  L.push('    +\'<h2 class="slide-title" contenteditable="true" style="outline:none">新頁標題（可點擊編輯）</h2></div>\'');
  L.push('    +\'<span class="page-tag">新增頁</span></div>\'');
  L.push('    +\'<div class="content-area" style="overflow:auto"><div contenteditable="true" style="min-height:200px;outline:none;font-size:15px;line-height:1.9;padding:4px 8px;">請點擊此處填寫內容...</div></div>\';');
  L.push("  document.getElementById('slidesWrapper').appendChild(ns);");
  L.push("  var nt=document.createElement('button');nt.className='nav-tab';nt.textContent='新增頁';");
  L.push("  document.getElementById('navTabs').appendChild(nt);");
  L.push('  rebindTabs();show(tot);');
  L.push('};');
  L.push("document.getElementById('btnDelSlide').onclick=function(){");
  L.push('  var slides=getSlides();var tabs=getTabs();');
  L.push("  if(slides.length<=1){alert('無法刪除唯一的頁面');return;}");
  L.push("  if(!confirm('確定要刪除第 '+cur+' 頁？此操作無法復原。'))return;");
  L.push('  if(slides[cur-1])slides[cur-1].remove();');
  L.push('  if(tabs[cur-1])tabs[cur-1].remove();');
  L.push('  rebindTabs();show(Math.min(cur,getSlides().length));');
  L.push('};');
  L.push("document.getElementById('btnSave').onclick=function(){");
  L.push("  var html='<!DOCTYPE html>'+document.documentElement.outerHTML;");
  L.push("  html=html.replace('</sty'+'le></head>','</sty'+'le><sty'+'le>.del-btn{display:none!important;}[contenteditable]{outline:none!important;}</sty'+'le></head>');");
  L.push("  var blob=new Blob([html],{type:'text/html;charset=utf-8'});");
  L.push("  var url=URL.createObjectURL(blob);");
  L.push("  var a=document.createElement('a');a.href=url;a.download='" + fnDs + "個人工作週報.html';");
  L.push('  document.body.appendChild(a);a.click();document.body.removeChild(a);');
  L.push('  setTimeout(function(){URL.revokeObjectURL(url);},1000);');
  L.push('};');
  L.push("document.addEventListener('keydown',function(e){");
  L.push("  if(e.target&&e.target.getAttribute&&e.target.getAttribute('contenteditable'))return;");
  L.push('  var tot=getSlides().length;');
  L.push("  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){if(cur<tot){show(cur+1);e.preventDefault();}}");
  L.push("  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(cur>1){show(cur-1);e.preventDefault();}}");
  L.push('});');
  L.push('show(1);scaleNormal();');
  L.push('})();');
  L.push('</scr' + 'ipt></body></html>');

  return { html: L.join('\n'), filename: `${fnDs}個人工作週報.html`, pages: TOT };
}

document.getElementById('btnReport').onclick = () => {
  try {
    repMsg('正在產出…');
    const r = buildHTMLReport();
    const blob = new Blob([r.html], { type:'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = r.filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    repMsg(`已下載 ${r.pages} 頁週報`);
  } catch(e){
    repMsg('產出失敗：' + e.message, true);
  }
};

/* =========================================================
   匯出 / 匯入
   ========================================================= */
document.getElementById('btnExport').onclick = () => {
  const payload = {
    _meta:{ app:'mj-workbench', version:1, exportedAt:new Date().toISOString() },
    todos:ST.todos, events:ST.events
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `workbench-snapshot-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = ev => {
  const f = ev.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let js;
    try { js = JSON.parse(rd.result); } catch(e){ alert('這不是有效的 JSON 檔'); return; }
    if (!confirm('匯入會覆蓋這台電腦目前的待辦／行程／目標／專案，確定？')) return;
    applyData(js, true);
    alert('已匯入');
  };
  rd.readAsText(f, 'utf-8');
  ev.target.value = '';
};
function applyData(js, persist){
  for (const k of ['todos','events']){
    if (Array.isArray(js[k])) { ST[k] = js[k]; if (persist) save(k); }
  }
  renderAllLocal();
}
function renderAllLocal(){
  renderTodos(); renderEvents(); renderCal(); renderPrjs(); renderHome();
}

/* =========================================================
   啟動
   ========================================================= */
(async function init(){
  load();

  const n = new Date();
  calY = n.getFullYear(); calM = n.getMonth();

  document.getElementById('btnLinkFile').onclick = linkDir;
  document.getElementById('btnReloadPrj').onclick = reloadProjects;
  document.getElementById('btnUnlinkFile').onclick = async () => {
    if (!confirm('改用本機儲存？資料夾裡的檔案會保留，之後隨時可以重新連結。')) return;
    dirHandle = null;
    MD_PROJECTS = []; prjMdInfo = '';
    await idbSet('dirHandle', null);
    document.getElementById('fileWho').style.display = 'none';
    syncUI();
    renderAllLocal();
    fileSt('已改用本機儲存');
  };

  if (!FS_OK) fileSt('這個瀏覽器不支援資料夾同步（需桌面版 Edge/Chrome + https），資料存本機');
  else await restoreDir();

  syncUI();
  renderAllLocal();

  const h = (location.hash || '#home').slice(1);
  if (PAGES.includes(h)) go(h);
})();
</script>
