<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的工作台</title>
<style>
:root{
  --bg:#f6f7f9;
  --card:#ffffff;
  --line:#e6e8ec;
  --line-soft:#f0f1f4;
  --ink:#1f2329;
  --ink-2:#5b6270;
  --ink-3:#9096a1;
  --accent:#c0392b;
  --accent-soft:#fdf0ee;
  --blue:#2f6fb5;
  --blue-soft:#eaf1f9;
  --green:#2e8b57;
  --green-soft:#eaf5ee;
  --amber:#b8860b;
  --amber-soft:#fdf6e3;
  --purple:#6a4c93;
  --purple-soft:#f2eef8;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.side{
  width:212px;flex:0 0 212px;
  background:var(--card);
  border-right:1px solid var(--line);
  padding:22px 14px;
  display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.side-id{padding:0 8px 18px}
.side-id .nm{font-size:15px;font-weight:700;letter-spacing:.02em}
.side-id .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.navbtn{
  display:flex;align-items:center;gap:9px;
  border:0;background:transparent;text-align:left;
  padding:9px 10px;border-radius:9px;color:var(--ink-2);
  font-size:13.5px;font-weight:500;width:100%;
}
.navbtn:hover{background:var(--line-soft);color:var(--ink)}
.navbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.navbtn svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
.side-foot button{
  border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:6px 9px;font-size:12px;color:var(--ink-2);text-align:left;
}
.side-foot button:hover{border-color:var(--ink-3);color:var(--ink)}
.side-foot .hint{font-size:11px;color:var(--ink-3);line-height:1.5}

.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1240px}
.page{display:none}
.page.on{display:block}

/* ---------- header ---------- */
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.hd h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em}
.hd .dt{font-size:13px;color:var(--ink-3);margin-top:3px}
.hd .tools{display:flex;gap:8px;align-items:center}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);
}
.card h2{
  margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ink-2);
  letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.card h2 .r{font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.empty{color:var(--ink-3);font-size:12.5px;padding:10px 0}

/* ---------- pills / chips ---------- */
.chip{
  display:inline-block;padding:1px 8px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
}
.c-work{background:var(--blue-soft);color:var(--blue)}
.c-self{background:var(--purple-soft);color:var(--purple)}
.c-meet{background:var(--amber-soft);color:var(--amber)}
.c-out{background:var(--green-soft);color:var(--green)}
.c-gen{background:var(--line-soft);color:var(--ink-2)}

/* ---------- progress ---------- */
.bar{height:7px;border-radius:20px;background:var(--line-soft);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:20px;background:var(--blue);transition:width .35s ease}
.bar.ok > i{background:var(--green)}
.bar.warn > i{background:var(--amber)}
.bar.bad > i{background:var(--accent)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi .lb{font-size:11.5px;color:var(--ink-3);letter-spacing:.03em}
.kpi .vl{font-size:23px;font-weight:700;margin-top:3px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .vl small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:3px}
.kpi .df{font-size:11.5px;margin-top:3px;color:var(--ink-3)}
.up{color:var(--green);font-weight:700}
.dn{color:var(--accent);font-weight:700}

/* ---------- table ---------- */
table.rpt{width:100%;border-collapse:collapse;font-size:13px}
table.rpt th,table.rpt td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
table.rpt th{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.03em;border-bottom:1px solid var(--line)}
table.rpt th:first-child,table.rpt td:first-child{text-align:left}
table.rpt td{font-variant-numeric:tabular-nums}
table.rpt tbody tr:hover{background:#fafbfc}
table.rpt tr.sum td{font-weight:700;border-top:1px solid var(--line);background:#fafbfc}
.tw{overflow-x:auto}

/* ---------- lists ---------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row .bd{flex:1;min-width:0}
.row .tt{font-size:13.5px;line-height:1.45;word-break:break-word}
.row .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .x{border:0;background:transparent;color:var(--ink-3);font-size:15px;line-height:1;padding:2px 4px;border-radius:5px}
.row .x:hover{background:var(--accent-soft);color:var(--accent)}
.ck{appearance:none;width:16px;height:16px;border:1.6px solid var(--ink-3);border-radius:5px;margin:3px 0 0;flex:0 0 16px;position:relative}
.ck:checked{background:var(--green);border-color:var(--green)}
.ck:checked::after{content:"";position:absolute;left:4.4px;top:1.4px;width:4px;height:8px;border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.done .tt{text-decoration:line-through;color:var(--ink-3)}
.due-soon{color:var(--amber);font-weight:700}
.due-over{color:var(--accent);font-weight:700}

/* ---------- forms ---------- */
.frm{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.frm input[type=text],.frm textarea{
  flex:1;min-width:130px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--card);
}
.frm input[type=date],.frm input[type=number],.frm select{
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);
}
.frm input:focus,.frm select:focus,.frm textarea:focus{outline:0;border-color:var(--blue)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#000}
.btn.sm{padding:4px 9px;font-size:12px;font-weight:500}

/* ---------- calendar ---------- */
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-hd .mo{font-size:15px;font-weight:700}
.cal-hd .nav{display:flex;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;color:var(--ink-3);text-align:center;padding:3px 0;font-weight:600}
.cel{
  min-height:70px;border:1px solid var(--line-soft);border-radius:9px;padding:5px 6px;
  background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:3px;
}
.cel:hover{border-color:var(--blue);background:var(--blue-soft)}
.cel.pad{background:#fafbfc;cursor:default;border-color:transparent}
.cel.pad:hover{background:#fafbfc}
.cel.today{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent-soft)}
.cel .dn{font-size:11.5px;color:var(--ink-3);font-weight:600;color:var(--ink-3)}
.cel.today .dn{color:var(--accent)}
.cel .ev{
  font-size:10.5px;border-radius:4px;padding:1px 4px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cel .ev.t{background:var(--accent-soft);color:var(--accent)}

/* ---------- misc ---------- */
.goal{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.goal:last-of-type{border-bottom:0}
.goal .gt{font-size:16px;font-weight:700;color:var(--accent);letter-spacing:.01em}
.goal .gd{font-size:12.5px;color:var(--ink-2);margin-top:3px;white-space:pre-wrap}
.prj{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.prj:last-of-type{border-bottom:0}
.prj .ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.prj .pn{font-size:13.5px;font-weight:600}
.prj .pp{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.prj .bar{margin-top:6px}
.note{
  background:var(--amber-soft);border:1px solid #f0e3c0;color:#7a5c05;
  border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:16px;line-height:1.55;
}
.note b{font-weight:700}
.hero{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px;
}
.hero .hi{font-size:19px;font-weight:700}
.hero .hs{font-size:13px;color:var(--ink-3);margin-top:2px}
.hero .quote{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--ink);color:#fff;font-weight:700}

/* ---------- 資料檔連結區 ---------- */
.auth{padding:10px 8px 12px;border-bottom:1px solid var(--line-soft);margin-bottom:8px}
.auth .who{font-size:11.5px;color:var(--green);font-weight:700;line-height:1.5;word-break:break-all}
.auth .st{font-size:11px;color:var(--ink-3);line-height:1.5;margin-top:2px}
.auth .st.err{color:var(--accent)}
.auth button{width:100%;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:700}
.auth button:hover{background:#000}
.auth button.ghost{background:var(--card);color:var(--ink-2);border-color:var(--line);font-weight:500;margin-top:5px}
.auth button.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
</style>
</head>
<body>
<div class="shell">

  <nav class="side">
    <div class="side-id">
      <div class="nm">我的工作台</div>
      <div class="sub" id="syncSub">資料存這台瀏覽器</div>
    </div>

    <div class="auth" id="fileBox">
      <div class="who" id="fileWho" style="display:none"></div>
      <div class="st" id="fileSt">尚未連結資料檔</div>
      <button id="btnLinkFile">連結 OneDrive 資料檔</button>
      <button class="ghost" id="btnUnlinkFile" style="display:none">改用本機儲存</button>
    </div>

    <button class="navbtn on" data-go="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>首頁總覽</button>
    <button class="navbtn" data-go="todo">
      <svg viewBox="0 0 24 24"><path d="M9 5h11"/><path d="M9 12h11"/><path d="M9 19h11"/><path d="m3 5 2 2 2-3"/><path d="m3 12 2 2 2-3"/><path d="m3 19 2 2 2-3"/></svg>待辦與行事曆</button>
    <button class="navbtn" data-go="goal">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>目標與專案</button>

    <div class="side-foot">
      <button id="btnReport" style="border-color:var(--ink);color:var(--ink);font-weight:700">產出 HTML 週報</button>
      <div class="hint" id="repMsg" style="display:none"></div>
      <button id="btnExport">匯出資料 JSON</button>
      <button id="btnImport">匯入資料 JSON</button>
      <input type="file" id="fileImport" accept=".json" hidden>
      <div class="hint" id="footHint">連結 OneDrive 的資料檔就能跨機同步；沒連結時只存這台瀏覽器。<br>← → 可換頁。</div>
    </div>
  </nav>

  <main class="main">

    <!-- ============ 首頁總覽 ============ -->
    <section class="page on" id="p-home">
      <div class="hero">
        <div class="hi" id="greet">你好</div>
        <div class="hs" id="today"></div>
        <div class="quote" id="heroSum"></div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h2>長期目標 <span class="r" id="homeGoalCnt"></span></h2>
        <div id="homeGoals"></div>
      </div>

      <div class="grid g3">
        <div class="card">
          <h2>待辦清單 <span class="r" id="homeTodoCnt"></span></h2>
          <div id="homeTodos"></div>
        </div>
        <div class="card">
          <h2>近期行程 <span class="r">未來 14 天</span></h2>
          <div id="homeEvents"></div>
        </div>
        <div class="card">
          <h2>專案進度 <span class="r" id="homePrjCnt"></span></h2>
          <div id="homePrjs"></div>
        </div>
      </div>
    </section>

    <!-- ============ 待辦與行事曆 ============ -->
    <section class="page" id="p-todo">
      <div class="hd">
        <div>
          <h1>待辦與行事曆</h1>
          <div class="dt">點月曆上的日期可直接新增當天行程</div>
        </div>
      </div>

      <div class="grid g2" style="margin-bottom:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)">
        <div class="card">
          <h2>待辦清單 <span class="r" id="todoCnt"></span></h2>
          <div id="todoList"></div>
          <div class="frm">
            <input type="text" id="tdText" placeholder="要做什麼？">
            <input type="date" id="tdDue">
            <select id="tdCat">
              <option value="work">工作</option>
              <option value="self">個人</option>
              <option value="meet">會議</option>
              <option value="out">外出</option>
            </select>
            <button class="btn pri" id="btnAddTodo">新增</button>
          </div>
          <div class="frm" style="border:0;padding-top:4px;margin-top:4px">
            <label style="font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px">
              <input type="checkbox" id="tdShowDone"> 顯示已完成
            </label>
            <button class="btn sm" id="btnClearDone" style="margin-left:auto">清除已完成</button>
          </div>
        </div>

        <div class="card">
          <div class="cal-hd">
            <div class="mo" id="calMo"></div>
            <div class="nav">
              <button class="btn sm" id="calPrev">←</button>
              <button class="btn sm" id="calToday">本月</button>
              <button class="btn sm" id="calNext">→</button>
            </div>
          </div>
          <div class="cal" id="calGrid"></div>
        </div>
      </div>

      <div class="card">
        <h2>行程 <span class="r" id="evCnt"></span></h2>
        <div id="evList"></div>
        <div class="frm">
          <input type="text" id="evText" placeholder="行程內容">
          <input type="date" id="evDate">
          <select id="evCat">
            <option value="work">工作</option>
            <option value="self">個人</option>
            <option value="meet">會議</option>
            <option value="out">外出</option>
          </select>
          <button class="btn pri" id="btnAddEv">新增</button>
        </div>
      </div>
    </section>

    <!-- ============ 目標與專案 ============ -->
    <section class="page" id="p-goal">
      <div class="hd">
        <div>
          <h1>目標與專案</h1>
          <div class="dt">專案可填相關連結，點過去看細節</div>
        </div>
      </div>

      <div class="grid g2">
        <div class="card">
          <h2>長期目標 <span class="r" id="goalCnt"></span></h2>
          <div id="goalList"></div>
          <div class="frm">
            <input type="text" id="glTitle" placeholder="目標（例：今年讀完 12 本書）">
            <button class="btn pri" id="btnAddGoal">新增</button>
          </div>
          <div class="frm" style="border:0;padding-top:4px;margin-top:0">
            <input type="text" id="glDesc" placeholder="補充說明（可留空）">
          </div>
        </div>

        <div class="card">
          <h2>專案排程 <span class="r" id="prjCnt"></span></h2>
          <div id="prjList"></div>
          <div class="frm">
            <input type="text" id="pjName" placeholder="專案名稱">
            <input type="number" id="pjPct" min="0" max="100" step="5" value="0" style="width:76px" title="進度 %">
            <button class="btn pri" id="btnAddPrj">新增</button>
          </div>
          <div class="frm" style="border:0;padding-top:4px;margin-top:0">
            <input type="text" id="pjUrl" placeholder="相關連結（台帳／成品網址，可留空）">
          </div>
        </div>
      </div>
    </section>

  </main>
</div>

<script>
/* =========================================================
   個人工作台（GitHub Pages 版）
   - 純個人資料，不含任何公司資訊、不連公司系統
   - 儲存兩種模式：
       本機模式 = localStorage（預設）
       同步模式 = File System Access API 直接讀寫 OneDrive 裡的一個 JSON 檔，
                  由 OneDrive 負責跨機同步。需 HTTPS（GitHub Pages 符合）。
   ========================================================= */

const K = {
  todos:   'MJ_WB_TODOS',
  events:  'MJ_WB_EVENTS',
  goals:   'MJ_WB_GOALS',
  projects:'MJ_WB_PROJECTS',
};
const CAT = {
  work:{lb:'工作', cls:'c-work'},
  self:{lb:'個人', cls:'c-self'},
  meet:{lb:'會議', cls:'c-meet'},
  out :{lb:'外出', cls:'c-out'},
};

let ST = { todos:[], events:[], goals:[], projects:[] };
let calY, calM;

/* =========================================================
   儲存層：本機 localStorage / OneDrive 檔案二選一
   ========================================================= */
const FS_OK = typeof window.showOpenFilePicker === 'function';
let fileHandle = null;      // 連結中的 OneDrive JSON 檔
let writeTimer = null;
let lastWrite = '';

function fileSt(msg, isErr){
  const el = document.getElementById('fileSt');
  el.textContent = msg || '';
  el.className = 'st' + (isErr ? ' err' : '');
}
function syncUI(){
  const on = !!fileHandle;
  document.getElementById('fileWho').style.display = on ? 'block' : 'none';
  document.getElementById('btnLinkFile').style.display = on ? 'none' : 'block';
  document.getElementById('btnUnlinkFile').style.display = on ? 'block' : 'none';
  document.getElementById('syncSub').textContent = on ? '同步中 · OneDrive 資料檔' : '資料存這台瀏覽器';
  document.getElementById('footHint').innerHTML = on
    ? '資料直接寫進 OneDrive 的資料檔，其他電腦開同一個檔就同步得到。<br>← → 可換頁。'
    : '連結 OneDrive 的資料檔就能跨機同步；沒連結時只存這台瀏覽器。<br>← → 可換頁。';
}

/* handle 存 IndexedDB，下次開頁不必重選檔案（仍需一次點擊授權） */
function idb(){
  return new Promise((res, rej) => {
    const q = indexedDB.open('mj-workbench', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('kv');
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function idbSet(k, v){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction('kv','readwrite');
    t.objectStore('kv').put(v, k);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
async function idbGet(k){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction('kv','readonly');
    const r = t.objectStore('kv').get(k);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

function stateJson(){
  return JSON.stringify({
    _meta:{ app:'mj-workbench', version:1, savedAt:new Date().toISOString() },
    todos:ST.todos, events:ST.events, goals:ST.goals, projects:ST.projects
  }, null, 2);
}
async function writeFileNow(){
  if (!fileHandle) return;
  const txt = stateJson();
  if (txt === lastWrite) return;
  try {
    const w = await fileHandle.createWritable();
    await w.write(txt);
    await w.close();
    lastWrite = txt;
    fileSt('已存檔 ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
  } catch(e){
    fileSt('寫入失敗：' + e.message, true);
  }
}
function scheduleWrite(){
  if (!fileHandle) return;
  clearTimeout(writeTimer);
  fileSt('儲存中…');
  writeTimer = setTimeout(writeFileNow, 800);
}

/* ---------- storage ---------- */
function load(){
  for (const k of ['todos','events','goals','projects']){
    try { ST[k] = JSON.parse(localStorage.getItem(K[k]) || '[]') || []; } catch(e){ ST[k] = []; }
  }
}
function save(key){
  localStorage.setItem(K[key], JSON.stringify(ST[key]));   // 永遠留一份本機備援
  scheduleWrite();
}
function isEmptyState(){
  return !ST.todos.length && !ST.events.length && !ST.goals.length && !ST.projects.length;
}

async function readFromHandle(h){
  const f = await h.getFile();
  const txt = (await f.text()).trim();
  if (!txt) return false;
  const js = JSON.parse(txt);
  for (const k of ['todos','events','goals','projects']){
    if (Array.isArray(js[k])){ ST[k] = js[k]; localStorage.setItem(K[k], JSON.stringify(ST[k])); }
  }
  lastWrite = stateJson();
  return true;
}
async function linkFile(){
  if (!FS_OK){
    fileSt('這個瀏覽器不支援檔案存取（需 Edge/Chrome，且須為 https）', true);
    return;
  }
  try {
    const [h] = await window.showOpenFilePicker({
      types:[{ description:'工作台資料檔', accept:{'application/json':['.json']} }],
      multiple:false
    });
    const perm = await h.requestPermission({ mode:'readwrite' });
    if (perm !== 'granted'){ fileSt('沒有取得寫入權限', true); return; }
    fileHandle = h;
    const had = await readFromHandle(h);
    if (!had) await writeFileNow();       // 空檔就把目前資料寫進去
    await idbSet('fileHandle', h);
    document.getElementById('fileWho').textContent = '✓ ' + h.name;
    syncUI();
    fileSt(had ? '已載入資料檔' : '已建立資料內容');
    renderAllLocal();
  } catch(e){
    if (e.name !== 'AbortError') fileSt('連結失敗：' + e.message, true);
  }
}
async function restoreFile(){
  if (!FS_OK) return false;
  try {
    const h = await idbGet('fileHandle');
    if (!h) return false;
    const perm = await h.queryPermission({ mode:'readwrite' });
    if (perm === 'granted'){
      fileHandle = h;
      await readFromHandle(h);
      document.getElementById('fileWho').textContent = '✓ ' + h.name;
      syncUI();
      fileSt('已連結資料檔');
      return true;
    }
    /* 瀏覽器重開後權限需要一次使用者手勢才能恢復 */
    document.getElementById('fileWho').style.display = 'block';
    document.getElementById('fileWho').textContent = '⏸ ' + h.name;
    document.getElementById('btnLinkFile').textContent = '重新授權資料檔';
    document.getElementById('btnLinkFile').onclick = async () => {
      const p = await h.requestPermission({ mode:'readwrite' });
      if (p === 'granted'){
        fileHandle = h;
        await readFromHandle(h);
        syncUI();
        fileSt('已重新連結');
        renderAllLocal();
        document.getElementById('btnLinkFile').textContent = '連結 OneDrive 資料檔';
        document.getElementById('btnLinkFile').onclick = linkFile;
      } else fileSt('授權被拒', true);
    };
    fileSt('資料檔需重新授權才會同步');
    return false;
  } catch(e){ return false; }
}
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const WD = ['日','一','二','三','四','五','六'];
function todayISO(){ return iso(new Date()); }
function daysBetween(aIso, bIso){
  const a = new Date(aIso + 'T00:00:00'), b = new Date(bIso + 'T00:00:00');
  return Math.round((a - b) / 86400000);
}
function fmtMD(isoStr){
  const [y,m,d] = isoStr.split('-');
  return `${Number(m)}/${Number(d)}`;
}
const nf = n => Number(n||0).toLocaleString('zh-TW');
function money(n){
  n = Number(n||0);
  if (Math.abs(n) >= 10000) return (n/10000).toFixed(1).replace(/\.0$/,'') + ' 萬';
  return nf(n);
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- nav ---------- */
const PAGES = ['home','todo','goal'];
function go(p){
  document.querySelectorAll('.page').forEach(el => el.classList.toggle('on', el.id === 'p-'+p));
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.go === p));
  location.hash = p;
  window.scrollTo(0,0);
}
document.querySelectorAll('.navbtn').forEach(b => b.onclick = () => go(b.dataset.go));
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const t = e.target, tag = (t.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || t.isContentEditable) return;
  const cur = PAGES.indexOf((location.hash || '#home').slice(1));
  const i = cur < 0 ? 0 : cur;
  const nx = e.key === 'ArrowRight' ? Math.min(i+1, PAGES.length-1) : Math.max(i-1, 0);
  if (nx !== i) go(PAGES[nx]);
});

function renderTodos(){
  const showDone = document.getElementById('tdShowDone').checked;
  const list = ST.todos
    .filter(t => showDone || !t.done)
    .sort((a,b) => (a.done - b.done) || ((a.due||'9999') > (b.due||'9999') ? 1 : -1));
  const open = ST.todos.filter(t => !t.done).length;
  document.getElementById('todoCnt').textContent = `未完成 ${open} / 共 ${ST.todos.length}`;
  document.getElementById('todoList').innerHTML = list.length
    ? '<div class="rows">' + list.map(t => todoRow(t)).join('') + '</div>'
    : '<div class="empty">目前沒有待辦</div>';
  bindTodoRows('#todoList');
}
function dueBadge(due){
  if (!due) return '';
  const d = daysBetween(due, todayISO());
  const cls = d < 0 ? 'due-over' : d <= 2 ? 'due-soon' : '';
  const lb = d < 0 ? `逾期 ${-d} 天` : d === 0 ? '今天到期' : d === 1 ? '明天到期' : `${d} 天後`;
  return `<span class="${cls}">${due}　${lb}</span>`;
}
function todoRow(t){
  const c = CAT[t.cat] || CAT.work;
  return `<div class="row ${t.done ? 'done' : ''}" data-id="${t.id}">
    <input type="checkbox" class="ck" ${t.done ? 'checked' : ''}>
    <div class="bd"><div class="tt">${esc(t.text)}</div>
      <div class="mt"><span class="chip ${c.cls}">${c.lb}</span>${dueBadge(t.due)}</div></div>
    <button class="x" title="刪除">×</button></div>`;
}
function bindTodoRows(sel){
  document.querySelectorAll(sel + ' .row').forEach(r => {
    const id = r.dataset.id;
    const ck = r.querySelector('.ck');
    if (ck) ck.onchange = () => {
      const t = ST.todos.find(x => x.id === id);
      if (t) { t.done = ck.checked; save('todos'); renderTodos(); renderHome(); }
    };
    const x = r.querySelector('.x');
    if (x) x.onclick = () => {
      ST.todos = ST.todos.filter(x2 => x2.id !== id);
      save('todos'); renderTodos(); renderHome(); renderCal();
    };
  });
}
document.getElementById('btnAddTodo').onclick = addTodo;
document.getElementById('tdText').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
function addTodo(){
  const el = document.getElementById('tdText');
  const text = el.value.trim();
  if (!text) return;
  ST.todos.push({ id:uid(), text, due:document.getElementById('tdDue').value || '', cat:document.getElementById('tdCat').value, done:false });
  save('todos');
  el.value = ''; document.getElementById('tdDue').value = '';
  renderTodos(); renderHome(); renderCal();
}

document.getElementById('btnClearDone').onclick = () => {

function renderCal(){
  const first = new Date(calY, calM, 1);
  const lastDay = new Date(calY, calM+1, 0).getDate();
  const lead = first.getDay();
  document.getElementById('calMo').textContent = `${calY} 年 ${calM+1} 月`;

  const byDate = {};
  for (const e of ST.events){
    (byDate[e.date] = byDate[e.date] || []).push({ t:e.text, cat:e.cat, todo:false });
  }
  for (const t of ST.todos){
    if (t.due && !t.done) (byDate[t.due] = byDate[t.due] || []).push({ t:t.text, cat:t.cat, todo:true });
  }

  let html = WD.map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < lead; i++) html += '<div class="cel pad"></div>';
  for (let d = 1; d <= lastDay; d++){
    const ds = `${calY}-${pad(calM+1)}-${pad(d)}`;
    const items = byDate[ds] || [];
    const isToday = ds === todayISO();
    html += `<div class="cel ${isToday ? 'today' : ''}" data-d="${ds}">
      <div class="dn">${d}</div>
      ${items.slice(0,3).map(x => {
        const c = CAT[x.cat] || CAT.work;
        return `<div class="ev ${x.todo ? 't' : c.cls}" title="${esc(x.t)}">${x.todo ? '待 ' : ''}${esc(x.t)}</div>`;
      }).join('')}
      ${items.length > 3 ? `<div class="ev c-gen">還有 ${items.length-3} 項</div>` : ''}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
  document.querySelectorAll('#calGrid .cel[data-d]').forEach(c => {
    c.onclick = () => {
      document.getElementById('evDate').value = c.dataset.d;
      document.getElementById('evText').focus();
    };
  });
}
document.getElementById('calPrev').onclick = () => { calM--; if (calM < 0){ calM = 11; calY--; } renderCal(); };
document.getElementById('calNext').onclick = () => { calM++; if (calM > 11){ calM = 0; calY++; } renderCal(); };
document.getElementById('calToday').onclick = () => { const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); renderCal(); };

function renderHome(){
  const now = new Date(), h = now.getHours();
  const g = h < 5 ? '深夜' : h < 11 ? '早安' : h < 13 ? '午安' : h < 18 ? '午安' : '晚安';

  document.getElementById('today').textContent =
    `${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日 · 星期${WD[now.getDay()]}`;

  const open = ST.todos.filter(t => !t.done);
  const over = open.filter(t => t.due && daysBetween(t.due, todayISO()) < 0).length;
  const soon = open.filter(t => t.due && daysBetween(t.due, todayISO()) >= 0 && daysBetween(t.due, todayISO()) <= 2).length;
  const upcoming = ST.events
    .filter(e => { const d = daysBetween(e.date, todayISO()); return d >= 0 && d <= 14; })
    .sort((a,b) => a.date > b.date ? 1 : -1);
  const parts = [];
  parts.push(open.length ? `待辦未完成 <b>${open.length}</b> 項` : '待辦都清完了');

  if (soon) parts.push(`<span style="color:var(--amber);font-weight:700">3 天內到期 ${soon} 項</span>`);
  parts.push(upcoming.length ? `未來兩週 <b>${upcoming.length}</b> 個行程` : '未來兩週沒有行程');

  /* 近期行程 */
  document.getElementById('homeEvents').innerHTML = upcoming.length
    ? '<div class="rows">' + upcoming.slice(0,7).map(e => {
        const c = CAT[e.cat] || CAT.work;
        const d = daysBetween(e.date, todayISO());
        return `<div class="row"><div class="bd">
          <div class="tt">${esc(e.text)}</div>
          <div class="mt"><span class="chip ${c.cls}">${c.lb}</span><span>${fmtMD(e.date)}（${WD[new Date(e.date+'T00:00:00').getDay()]}）${d === 0 ? ' · 今天' : d === 1 ? ' · 明天' : ''}</span></div>
        </div></div>`;
      }).join('') + '</div>'
    : '<div class="empty">未來兩週沒有行程</div>';

  /* 目標 */
  document.getElementById('homeGoalCnt').textContent = `共 ${ST.goals.length} 項`;
  document.getElementById('homeGoals').innerHTML = ST.goals.length
    ? ST.goals.slice(0,3).map(g => `<div class="goal"><div class="gt">${esc(g.title)}</div>${g.desc ? `<div class="gd">${esc(g.desc)}</div>` : ''}</div>`).join('')
    : '<div class="empty">還沒設定長期目標，去「目標與專案」新增</div>';

  /* 專案 */
  document.getElementById('homePrjCnt').textContent = `共 ${ST.projects.length} 項`;
  document.getElementById('homePrjs').innerHTML = ST.projects.length
    ? ST.projects.slice(0,5).map(p => {
        const cls = p.pct >= 100 ? 'ok' : p.pct >= 50 ? '' : p.pct > 0 ? 'warn' : 'bad';
        return `<div class="prj"><div class="ph"><span class="pn">${esc(p.name)}</span><span class="pp">${p.pct}%</span></div>
          <div class="bar ${cls}"><i style="width:${p.pct}%"></i></div></div>`;
      }).join('')
    : '<div class="empty">還沒有專案</div>';
}

function buildHTMLReport(){
  const now = new Date();
  const ds  = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  const fnDs = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`;

  /* ── 待辦／行程彙整 ── */
  const openTodos = ST.todos.filter(t => !t.done)
    .sort((a,b) => (a.due||'9999') > (b.due||'9999') ? 1 : -1);
  const doneTodos = ST.todos.filter(t => t.done);
  const overCnt = openTodos.filter(t => t.due && daysBetween(t.due, todayISO()) < 0).length;
  const soonCnt = openTodos.filter(t => { if(!t.due) return false; const d = daysBetween(t.due, todayISO()); return d >= 0 && d <= 2; }).length;
  const upcoming = ST.events
    .filter(e => { const d = daysBetween(e.date, todayISO()); return d >= 0 && d <= 14; })
    .sort((a,b) => a.date > b.date ? 1 : -1);

  const todoSt = t => {

document.getElementById('btnReport').onclick = () => {
  try {
    repMsg('正在產出…');
    const r = buildHTMLReport();
    const blob = new Blob([r.html], { type:'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = r.filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    repMsg(`已下載 ${r.pages} 頁週報`);
  } catch(e){
    repMsg('產出失敗：' + e.message, true);
  }
};

/* =========================================================
   匯出 / 匯入
   ========================================================= */
document.getElementById('btnExport').onclick = () => {
  const payload = {
    _meta:{ app:'mj-workbench', version:1, exportedAt:new Date().toISOString() },
    todos:ST.todos, events:ST.events, goals:ST.goals, projects:ST.projects
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `workbench-snapshot-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = ev => {
  const f = ev.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let js;
    try { js = JSON.parse(rd.result); } catch(e){ alert('這不是有效的 JSON 檔'); return; }
    if (!confirm('匯入會覆蓋這台電腦目前的待辦／行程／目標／專案，確定？')) return;
    applyData(js, true);
    alert('已匯入');
  };
  rd.readAsText(f, 'utf-8');
  ev.target.value = '';
};
function applyData(js, persist){
  for (const k of ['todos','events','goals','projects']){
    if (Array.isArray(js[k])) { ST[k] = js[k]; if (persist) save(k); }
  }
  renderAllLocal();
}
function renderAllLocal(){
  renderTodos(); renderEvents(); renderCal(); renderGoals(); renderPrjs(); renderHome();
}

/* =========================================================
   啟動
   ========================================================= */
(async function init(){
  load();

  const n = new Date();
  calY = n.getFullYear(); calM = n.getMonth();

  document.getElementById('btnLinkFile').onclick = linkFile;
  document.getElementById('btnUnlinkFile').onclick = async () => {
    if (!confirm('改用本機儲存？資料檔會保留在 OneDrive，之後隨時可以重新連結。')) return;
    fileHandle = null;
    await idbSet('fileHandle', null);
    document.getElementById('fileWho').style.display = 'none';
    syncUI();
    fileSt('已改用本機儲存');
  };

  if (!FS_OK) fileSt('這個瀏覽器不支援檔案同步（需 Edge/Chrome + https），資料存本機');
  else await restoreFile();

  syncUI();
  renderAllLocal();

  const h = (location.hash || '#home').slice(1);
  if (PAGES.includes(h)) go(h);
})();
</script>
